<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Enviar Email de Verificação</title>
  </head>
  <body>
    <h1>Enviar Email de Verificação</h1>

    {% if success %}
    <p style="color: green">{{ success }}</p>
    {% endif %}

    <form method="post">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
