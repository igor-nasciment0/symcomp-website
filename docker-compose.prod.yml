services:
  postgres:
    restart: unless-stopped
  
  backend:
    build:
      # docker compose will build the image from the local Dockerfile
      # on the server, using the final production stage by default
      context: ./symcomp-server
    restart: unless-stopped
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120

  frontend:
    build:
      context: ./symcomp
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend
      - backend
  
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  postgres_data:
  certbot_conf:
  certbot_www:


